<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Profile Settings - Campus Cart</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1e40af",
                        "campus-yellow": "#facc15",
                        "background-light": "#f9fafb",
                        "background-dark": "#111827",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
        }
        .section-label {
            @apply text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 block capitalize;
        }
        .sketch-card {
            @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 mb-6;
        }
        .input-field {
            @apply w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-campus-yellow focus:border-transparent outline-none transition-all dark:text-white;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-background-dark min-h-screen transition-colors duration-200">
    <div class="bg-red-50 dark:bg-red-900/20 border-b border-red-100 dark:border-red-900/30 px-4 py-3">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div
                    class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 dark:bg-red-800/40 flex items-center justify-center">
                    <span class="material-symbols-outlined text-red-600 dark:text-red-400 text-xl">priority_high</span>
                </div>
                <div>
                    <p class="text-sm font-semibold text-red-900 dark:text-red-100">Your profile is only 60% complete!
                    </p>
                    <p class="text-xs text-red-700 dark:text-red-300">Finish verification to unlock all features and
                        start selling.</p>
                </div>
            </div>
            <button
                class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold px-6 py-2 rounded-lg transition-colors shadow-sm whitespace-nowrap">
                Complete Now
            </button>
        </div>
    </div>
    <main class="py-8 px-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-8">Profile Settings</h1>
            <section class="sketch-card">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white">Profile</h2>
                </div>
                <div class="flex flex-col items-center mb-8">
                    <div class="relative group">
                        <div
                            class="w-32 h-32 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-md overflow-hidden">
                            <span class="material-symbols-outlined text-6xl text-slate-400">person</span>
                        </div>
                        <button
                            class="absolute bottom-1 right-1 bg-white dark:bg-slate-700 p-2 rounded-full shadow-lg border border-slate-200 dark:border-slate-600">
                            <span
                                class="material-symbols-outlined text-lg text-slate-600 dark:text-slate-300">add_a_photo</span>
                        </button>
                    </div>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="section-label" for="name">Name</label>
                        <input class="input-field" id="name" placeholder="Full Name" type="text" value="Rahul Sharma" />
                    </div>
                    <div>
                        <label class="section-label" for="campus">Campus</label>
                        <input class="input-field" id="campus" placeholder="Your University/College Name" type="text"
                            value="Indian Institute of Technology, Delhi" />
                    </div>
                    <div>
                        <label class="section-label" for="bio">Bio</label>
                        <textarea class="input-field resize-none" id="bio" placeholder="Tell us about yourself..."
                            rows="3">CS student passionate about tech and sustainability. Always looking to buy/sell course materials.</textarea>
                    </div>
                </div>
            </section>
            <section class="sketch-card">
                <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-6">Contact Info</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="section-label" for="email">Email (College)</label>
                        <input class="input-field" id="email" placeholder="college-email@edu.com" type="email"
                            value="rahul.s@campus.edu" />
                    </div>
                    <div>
                        <label class="section-label" for="phone">Phone No.</label>
                        <input class="input-field" id="phone" placeholder="+91 XXXXX XXXXX" type="tel"
                            value="+91 98765 43210" />
                    </div>
                </div>
            </section>
            <section class="sketch-card">
                <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-6">Verification</h2>
                <div class="space-y-6">
                    <div>
                        <label class="section-label">Upload ID Card</label>
                        <div
                            class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-10 flex flex-col items-center justify-center bg-slate-50/50 dark:bg-slate-800/30 hover:border-campus-yellow transition-colors cursor-pointer group">
                            <div
                                class="w-12 h-12 bg-white dark:bg-slate-700 rounded-full flex items-center justify-center shadow-sm mb-4 group-hover:scale-110 transition-transform">
                                <span
                                    class="material-symbols-outlined text-slate-400 group-hover:text-campus-yellow">upload</span>
                            </div>
                            <p class="text-sm font-semibold text-slate-900 dark:text-white text-center">Upload Photo
                                with ID card in camera frame</p>
                            <p class="text-xs text-slate-500 mt-2">PNG, JPG up to 5MB</p>
                        </div>
                    </div>
                    <div>
                        <label class="section-label" for="enr-no">Enr no.</label>
                        <input class="input-field" id="enr-no" placeholder="e.g. 2021CSB10XX" type="text" />
                    </div>
                    <div>
                        <label class="section-label" for="abc-id">ABC ID</label>
                        <input class="input-field" id="abc-id" placeholder="12-digit Academic Bank of Credits ID"
                            type="text" />
                    </div>
                </div>
            </section>
            <section class="sketch-card">
                <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-6">Social Link</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="section-label" for="facebook">Facebook</label>
                        <input class="input-field text-sm" id="facebook" placeholder="facebook.com/username"
                            type="text" />
                    </div>
                    <div>
                        <label class="section-label" for="instagram">Instagram</label>
                        <input class="input-field text-sm" id="instagram" placeholder="instagram.com/username"
                            type="text" />
                    </div>
                    <div>
                        <label class="section-label" for="linkedin">Linkedin</label>
                        <input class="input-field text-sm" id="linkedin" placeholder="linkedin.com/in/username"
                            type="text" />
                    </div>
                </div>
            </section>
            <div class="flex gap-4 mb-10">
                <button
                    class="flex-1 py-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm">
                    Cancel
                </button>
                <button
                    class="flex-1 py-4 bg-campus-yellow text-slate-900 font-bold rounded-xl hover:bg-yellow-500 transition-all shadow-md">
                    Save
                </button>
            </div>
        </div>
    </main>
</body>

</html>
