<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CampusCart Chat - Meetup Action</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ebb50b", // Yellow for incoming/primary brand
                        secondary: "#71b55a", // Green for outgoing
                        "background-light": "#f9fafb",
                        "background-dark": "#111827",
                        charcoal: "#333333",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bubble-tail-left::before {
            content: '';
            position: absolute;
            left: -8px;
            bottom: 0;
            width: 20px;
            height: 20px;
            background: inherit;
            clip-path: polygon(100% 0, 0% 100%, 100% 100%);
        }

        .bubble-tail-right::after {
            content: '';
            position: absolute;
            right: -8px;
            bottom: 0;
            width: 20px;
            height: 20px;
            background: inherit;
            clip-path: polygon(0 0, 0% 100%, 100% 100%);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
    <div
        class="w-full max-w-4xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl overflow-hidden flex flex-col h-[650px]">
        <header
            class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 z-10">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <img alt="Student Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-primary"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwgKAKHcfkb2b30AmqHY81GK4FHJDGoTpEi4bhw3Ul3n-tpIpVeroFzyjwFMJ-m6me__lXiBLPjyeLWanm2FUptHDGo6dQDzm2gmhqVwTRwAjNUkAK1bZaH2o8gGej0tTFEJU4znYk9u4oheWn9S5M557svVpGJ9kJyez0yN-cAn0Ujh1_gMBw-Ox-3LbywZPyRlxMjPlhF_15OTllJEVktHiShRbgSUBEsREsFEVAbrTHNZ_o5X5mTE_F8iPStsa2dM596V5cm8Q" />
                    <span
                        class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-bold text-gray-900 dark:text-white text-lg">Alex Rivera</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span> Online
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-gray-500 dark:text-gray-400">
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                    <span class="material-icons-outlined">info</span>
                </button>
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                    <span class="material-icons-outlined">logout</span>
                </button>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-8 space-y-8 bg-gray-50 dark:bg-gray-950/50 relative">
            <div class="flex justify-start">
                <div class="relative bg-primary text-black px-5 py-3 rounded-2xl max-w-md shadow-sm">
                    <p class="font-medium">meetup location details</p>
                    <span class="text-[10px] opacity-60 mt-1 block text-right">10:24 AM</span>
                </div>
            </div>
            <div class="flex justify-end">
                <div class="relative bg-secondary text-white px-5 py-3 rounded-2xl max-w-md shadow-sm">
                    <p class="font-medium">meetup location details</p>
                    <span class="text-[10px] opacity-80 mt-1 block text-right">10:26 AM</span>
                </div>
            </div>
            <div class="absolute bottom-6 right-6">
                <div
                    class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg overflow-hidden w-32">
                    <button
                        class="w-full py-2 px-4 text-sm font-semibold text-charcoal dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors border-b border-gray-100 dark:border-gray-700 uppercase tracking-wider">
                        change
                    </button>
                    <button
                        class="w-full py-2 px-4 text-sm font-semibold text-charcoal dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors uppercase tracking-wider">
                        confirm
                    </button>
                </div>
            </div>
        </main>
        <footer class="p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800">
            <div class="flex flex-col gap-4">
                <button
                    class="w-full py-4 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-black dark:text-white font-bold rounded-xl transition-all active:scale-[0.99] uppercase tracking-widest text-sm">
                    Set Meetup
            </button>
            </div>
        </footer>
    </div>
</body>

</html>
